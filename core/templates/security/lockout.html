<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Locked | Trading Journal</title>

  <!-- Early theme init -->
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const useDark = saved ? saved === "dark" : prefersDark;
      if (useDark) document.documentElement.classList.add("dark");
      document.documentElement.style.colorScheme = useDark ? "dark" : "light";
    })();
  </script>

  <!-- Tailwind -->
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body{ font-family:'Inter',system-ui; }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-slate-100 via-slate-200 to-slate-100 text-gray-900 dark:from-gray-950 dark:via-gray-900 dark:to-gray-950 dark:text-gray-100">
  <main class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-lg bg-white/85 dark:bg-gray-900/80 backdrop-blur-sm border border-slate-200 dark:border-gray-800 shadow-2xl rounded-2xl p-8 text-center">
      <div class="mx-auto mb-4 h-14 w-14 flex items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 7V5a3 3 0 0 1 6 0v2"/></svg>
      </div>
      <h1 class="text-2xl font-extrabold mb-2">Account Temporarily Locked</h1>
      <p class="text-sm text-gray-600 dark:text-gray-400">Too many failed login attempts were detected. </p>
      <p class="mt-4 text-sm text-gray-700 dark:text-gray-300">Please wait a few minutes and try again, or contact the administrator if you believe this is an error.</p>

      <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/accounts/login/" class="inline-flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold shadow">Back to Login</a>
        <a href="mailto:admin@example.com" class="inline-flex items-center justify-center bg-slate-200 hover:bg-slate-300 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 px-4 py-2 rounded-lg font-semibold">Contact Support</a>
      </div>
    </div>
  </main>
</body>
</html>
